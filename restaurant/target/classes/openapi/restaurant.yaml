openapi: 3.0.0

info:
  title: Restaurant Menu API
  description: API a restaurant menü elemek kezelésére
  version: 1.0.0

servers:
  - url: https://oe-html-5-2025-tavasz.wiremockapi.cloud/api
  - url: http://localhost:8080/api
    description: Helyi fejlesztői szerver

paths:

  /menu:
    get:
      operationId: menuGet
      summary: Menüelemek listázása
      description: Lekérdezi az összes menüelemet opcionális szűréssel.
      parameters:
        - in: query
          name: sugarFree
          required: false
          schema:
            type: boolean
        - in: query
          name: glutenFree
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Sikeres lekérdezés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemResponse"
        "400":
          description: Hibás kérés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Szerver hiba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: menuPost
      summary: Új menüelem létrehozása
      description: Új étel vagy ital hozzáadása
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemRequest"
      responses:
        "201":
          description: Sikeres létrehozás
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdModel"
        "400":
          description: Hibás kérés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /menu/{id}:
    get:
      operationId: menuIdGet
      summary: Menüelem lekérdezése
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sikeres lekérdezés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemResponse"
        "404":
          description: Nem található
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: menuIdPut
      summary: Menüelem módosítása
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemRequest"
      responses:
        "200":
          description: Sikeres módosítás
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdModel"
        "404":
          description: Nem található
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: menuIdDelete
      summary: Menüelem törlése
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Sikeres törlés
        "404":
          description: Nem található
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /menu/gluten-free:
    get:
      operationId: menuGlutenFreeGet
      summary: Gluténmentes elemek listázása
      responses:
        "200":
          description: Sikeres lekérdezés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemResponse"

components:

  schemas:

    IdModel:
      type: object
      properties:
        id:
          type: integer

    MenuItemRequest:
      type: object
      required:
        - name
        - quantity
        - category
        - sugarFree
        - glutenFree
      properties:
        name:
          type: string
          x-field-extra-annotation: '@hu.oe.yokudlela.restaurant.validation.NameExists(message="error.menuitem.name.exists")'

        quantity:
          type: integer
          minimum: 1
          maximum: 20
          x-field-extra-annotation: '@hu.oe.yokudlela.restaurant.validation.ValidOrderQuantity(message="error.quantity.invalid")'

        category:
          type: string
          enum:
            - MAIN_COURSE
            - DESSERT
            - DRINK

        sugarFree:
          type: boolean

        glutenFree:
          type: boolean

    MenuItemResponse:
      allOf:
        - $ref: "#/components/schemas/IdModel"
        - $ref: "#/components/schemas/MenuItemRequest"

    ApiError:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: string